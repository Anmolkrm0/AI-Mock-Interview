# Optional: a throwaway PostgreSQL for running the backend test suite locally.
# The app itself uses Supabase (cloud) for its database, auth and storage.
#   docker compose up -d test-db
#   TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54329/mock_interview_test pytest
services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
